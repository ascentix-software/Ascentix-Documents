name: documents-plugins-$(Date:yyyyMMdd)-$(Rev:r)
# Pushes to main build here; other branches build through their pull request, so a commit
# on a branch with an open PR runs once.
trigger:
  branches:
    include: ['main']
  paths:
    include: ['src/*', 'tests/*', 'Directory.Build.props', 'NuGet.Config', 'Ascentix.Documents.sln', 'scripts/build-plugins.ps1', 'scripts/verify-source-boundary.ps1', 'pipelines/plugins-ci.yml']
pr:
  paths:
    include: ['src/*', 'tests/*', 'Directory.Build.props', 'NuGet.Config', 'Ascentix.Documents.sln', 'scripts/build-plugins.ps1', 'scripts/verify-source-boundary.ps1', 'pipelines/plugins-ci.yml']
pool:
  vmImage: windows-latest
steps:
  - checkout: self
    persistCredentials: false
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.0.302
  - pwsh: ./scripts/build-plugins.ps1
    displayName: Build and test plugins using a disposable development key
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/TestResults/*.trx'
      failTaskOnFailedTests: true
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.SourcesDirectory)/artifacts/plugins
      artifact: documents-plugins-development
