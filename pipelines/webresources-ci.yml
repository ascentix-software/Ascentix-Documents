name: documents-webresources-$(Date:yyyyMMdd)-$(Rev:r)
# Pushes to main build here; other branches build through their pull request, so a commit
# on a branch with an open PR runs once.
trigger:
  branches:
    include: ['main']
  paths:
    include: ['client/*', 'scripts/build-webresources.ps1', 'tests/web/*', 'pipelines/webresources-ci.yml']
pr:
  paths:
    include: ['client/*', 'scripts/build-webresources.ps1', 'tests/web/*', 'pipelines/webresources-ci.yml']
pool:
  vmImage: windows-latest
steps:
  - checkout: self
    persistCredentials: false
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
  - pwsh: ./scripts/build-webresources.ps1
    displayName: Validate and package web resources independently
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.SourcesDirectory)/artifacts/webresources
      artifact: documents-webresources
